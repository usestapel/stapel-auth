name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stapel-gdpr (PyPI)
        run: pip install stapel-gdpr

      - name: Install package with all extras
        run: pip install -e ".[all]"

      - name: Install test dependencies
        run: pip install pytest pytest-django pytest-cov python3-openid "stapel-tools>=0.9.1,<1"

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: emit-check (outbox atomicity gate)
        run: python -m stapel_core.lint.emit_check .

      - name: migration-lint (expand/contract gate, release-management.md §3)
        run: |
          pip install "stapel-tools>=0.9.1,<1" --quiet
          stapel-migration-lint . --strict

      # SCH001 at ERROR, not warning. The gate ships at warning fleet-wide
      # because 25 of 26 schema-bearing libraries have no wire test and a rule
      # that reds a whole fleet on day one gets skimmed. This library HAS one
      # (tests/test_contract_wire.py drives 96 of 97 declared operations), so
      # it opts in and cannot regress: delete the wire test and this fails.
      #
      # `stapel-schema-lint` ships in stapel-tools AFTER 0.67.4, so the pinned
      # install above may not carry it yet. The guard says so out loud and
      # passes rather than failing on a missing command — a step that cannot
      # run is not a finding. It is NOT a silent skip: the message names what
      # is missing, and the guard comes out the moment stapel-tools publishes
      # the gate, at which point the pin below should be raised to that
      # version so the absence becomes impossible rather than tolerated.
      - name: schema-lint (the contract is proved against the wire, not itself)
        run: |
          if command -v stapel-schema-lint >/dev/null 2>&1; then
            stapel-schema-lint . --strict
          else
            echo "stapel-schema-lint is not in the installed stapel-tools" \
                 "(needs a release later than 0.67.4) — SCH001 not enforced" \
                 "on this run. Raise the stapel-tools pin to arm it."
          fi

      - name: Import check
        run: python -c "import stapel_auth; print('import OK')"

      - name: Tests with coverage
        run: |
          python -m pytest --pyargs stapel_auth.tests \
            --cov=stapel_auth \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-auth
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The concurrency gate (the idiom is stapel-core's). SQLite `:memory:` gives
  # every connection its own database, so two writers never meet and the SSO
  # first-login race cannot be reproduced there. It is reproduced here against
  # a real server: two threads, two connections, one (org, subject) identity.
  concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stapel-gdpr (PyPI)
        run: pip install stapel-gdpr
      - run: pip install -e ".[all]" pytest pytest-django python3-openid "psycopg[binary]"
      - name: SSO first-login race against Postgres
        env:
          STAPEL_TEST_DATABASE_URL: postgres://postgres:stapel@127.0.0.1:5432/auth_test
        # The suite asserts the variable was honoured, so this job cannot go
        # green by quietly running on SQLite.
        run: python -m pytest --pyargs stapel_auth.tests.test_sso_identity_race -q -v

  core-main:
    # Advisory / early-warning job — installs stapel-core (and any sibling)
    # from git main so a breaking change on core's main branch shows up here
    # before it reaches a release, without ever gating this repo's CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stapel-core
        run: pip install git+https://github.com/usestapel/stapel-core.git

      - name: Install stapel-gdpr
        run: pip install git+https://github.com/usestapel/stapel-gdpr.git

      - name: Install package with all extras
        run: pip install -e ".[all]"

      - name: Install test dependencies
        run: pip install pytest pytest-django pytest-cov python3-openid "stapel-tools>=0.9.1,<1"

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: emit-check (outbox atomicity gate)
        run: python -m stapel_core.lint.emit_check .

      - name: migration-lint (expand/contract gate, release-management.md §3)
        run: |
          pip install "stapel-tools>=0.9.1,<1" --quiet
          stapel-migration-lint . --strict

      - name: Import check
        run: python -c "import stapel_auth; print('import OK')"

      - name: Tests with coverage
        run: |
          python -m pytest --pyargs stapel_auth.tests \
            --cov=stapel_auth \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-auth
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release-track:
    # Release gate — library-standard §7.4. Installs the package the way an end
    # user does: dependencies (incl. stapel-core) resolved from PyPI strictly by
    # the declared pins — no git-main core, no editable siblings. Catches "pin
    # into the void" and drift between the core branch and the published wheel.
    # Blocking (library-standard §7.5): the stapel dependency graph is now fully
    # on PyPI, so a green run here is a precondition for a vX.Y.Z tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install as an end user (deps resolved from PyPI by pin)
        run: pip install .
      - name: Verify stapel-core resolved from PyPI satisfies the declared pin
        # Reads the range straight out of pyproject.toml instead of a hardcoded
        # tuple — the previous hardcoded `==(0,8)` silently went stale (and
        # failed every run) three pin bumps ago (>=0.8,<0.9 -> >=0.10,<0.11 ->
        # >=0.10,<0.12) because nobody remembered to update this step in step
        # with the dependency line.
        run: |
          cd "$RUNNER_TEMP" && python -c "
          import importlib.metadata as m
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path('$GITHUB_WORKSPACE/pyproject.toml').read_text())
          dep = next(d for d in pyproject['project']['dependencies'] if d.startswith('stapel-core'))
          floor_s, ceil_s = re.search(r'>=([\d.]+),<([\d.]+)', dep).groups()
          floor = tuple(map(int, floor_s.split('.')))
          ceil = tuple(map(int, ceil_s.split('.')))
          v = m.version('stapel-core')
          got = tuple(map(int, v.split('.')[:len(floor)]))
          print(f'stapel-core {v} against {dep!r}')
          assert floor <= got < ceil, f'{v} outside declared range {dep!r}'
          "
      - name: Import smoke (installed package, from a clean dir)
        run: cd "$RUNNER_TEMP" && python -c "import stapel_auth; print('release-track import OK')"
